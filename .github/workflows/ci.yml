name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"

jobs:
  backend:
    name: Backend (build, unit, architecture, integration, migrations, OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Trimme.slnx

      - name: Build (warnings as errors)
        run: dotnet build Trimme.slnx --no-restore -c Release

      - name: Unit and architecture tests
        run: |
          dotnet test --project tests/Trimme.UnitTests --no-build -c Release
          dotnet test --project tests/Trimme.ArchitectureTests --no-build -c Release

      # Testcontainers starts postgis/postgis:17-3.5 using the runner's Docker daemon.
      # Includes Migrations_ApplyToEmptyDatabase, Model_HasNoPendingChanges and the OpenAPI drift check.
      - name: Integration tests
        run: dotnet test --project tests/Trimme.IntegrationTests --no-build -c Release

      - name: Migration validation (no pending model changes)
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Trimme.Migrations --startup-project apps/api/Trimme.Api --no-build --configuration Release

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up --build and wait for /health/ready
        run: bash infra/scripts/compose-smoke.sh --down
