name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"

jobs:
  backend:
    name: Backend (build, unit, architecture, integration, migrations, OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Trimme.slnx

      - name: Build (warnings as errors)
        run: dotnet build Trimme.slnx --no-restore -c Release

      - name: Unit and architecture tests
        run: |
          dotnet test --project tests/Trimme.UnitTests --no-build -c Release
          dotnet test --project tests/Trimme.ArchitectureTests --no-build -c Release

      # Testcontainers starts postgis/postgis:17-3.5 using the runner's Docker daemon.
      # Includes Migrations_ApplyToEmptyDatabase, Model_HasNoPendingChanges and the OpenAPI drift check.
      - name: Integration tests
        run: dotnet test --project tests/Trimme.IntegrationTests --no-build -c Release

      - name: Migration validation (no pending model changes)
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Trimme.Migrations --startup-project apps/api/Trimme.Api --no-build --configuration Release

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # Run as the runner user so git inside the container accepts the bind-mounted checkout (no "dubious ownership").
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose

  web:
    name: Web (lint, typecheck, format, unit tests, OpenAPI client, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, no warnings)
        run: pnpm lint

      - name: Typecheck (strict TypeScript, web + E2E)
        run: |
          pnpm typecheck
          pnpm --filter @trimme/e2e typecheck

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Unit tests (Vitest, incl. message key parity and token contrast)
        run: pnpm test

      - name: OpenAPI client drift check
        run: pnpm openapi:check

      - name: Production build
        run: pnpm build

  stack:
    name: Docker Compose stack + Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: docker compose up --build (postgis -> migrate -> api -> web) and wait until ready
        run: bash infra/scripts/compose-smoke.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install E2E dependencies
        run: |
          pnpm install --frozen-lockfile --filter @trimme/e2e
          pnpm --filter @trimme/e2e exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/E2E/playwright-report
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
