# Local development stack. Start from the repository root:
#   docker compose -f infra/docker-compose.yml up --build
# Values below are LOCAL DEVELOPMENT defaults only; override them in infra/.env (see infra/.env.example).
name: trimme

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${TRIMME_API_ENVIRONMENT:-Development}
  ConnectionStrings__Trimme: Host=postgres;Port=5432;Database=${TRIMME_DB_NAME:-trimme};Username=${TRIMME_DB_USER:-trimme};Password=${TRIMME_DB_PASSWORD:-trimme_local_dev};Gss Encryption Mode=Disable
  Cors__AllowedOrigins__0: ${TRIMME_WEB_ORIGIN:-http://localhost:3000}
  # Links in emails (password reset, invitations) point at the web app.
  Web__PublicBaseUrl: ${TRIMME_WEB_ORIGIN:-http://localhost:3000}
  # Local email goes to Mailpit (web UI: http://localhost:8025). Production SMTP is configured only via env vars.
  Email__Smtp__Host: mailpit
  Email__Smtp__Port: "1025"
  Email__Smtp__Security: None
  # In local compose the web container proxies /api, so every browser shares one client IP at the API.
  # These higher limits are for local development and E2E only; production keeps the code defaults.
  RateLimiting__otp__PermitLimit: ${TRIMME_OTP_RATE_LIMIT:-500}
  RateLimiting__auth__PermitLimit: ${TRIMME_AUTH_RATE_LIMIT:-1000}
  # Location picker geocoding (D-007): the built-in Riyadh gazetteer by default, so no automated run calls a third
  # party. Set TRIMME_GEOCODER=Nominatim for real OpenStreetMap lookups (light development use only, 1 request/s).
  Geocoding__Provider: ${TRIMME_GEOCODER:-Fake}

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${TRIMME_DB_NAME:-trimme}
      POSTGRES_USER: ${TRIMME_DB_USER:-trimme}
      POSTGRES_PASSWORD: ${TRIMME_DB_PASSWORD:-trimme_local_dev}
    ports:
      - "${TRIMME_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies EF Core migrations, then exits. The API never migrates on startup (D-038).
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: trimme-api:dev
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot, development only: creates the bootstrap SuperAdmin (R-AUTH-03) and future demo data, then exits.
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: trimme-api:dev
    command: ["seed", "--dev"]
    environment:
      <<: *api-environment
      TRIMME_ALLOW_DEV_SEED: "true"
      TRIMME_BOOTSTRAP_ADMIN_EMAIL: ${TRIMME_BOOTSTRAP_ADMIN_EMAIL:-admin@trimme.local}
      TRIMME_BOOTSTRAP_ADMIN_PASSWORD: ${TRIMME_BOOTSTRAP_ADMIN_PASSWORD:-trimme local admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${TRIMME_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: trimme-api:dev
    environment: *api-environment
    ports:
      - "${TRIMME_API_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        TRIMME_API_INTERNAL_URL: http://api:8080
        # Map tiles for the location picker; empty uses OpenStreetMap's public tiles (development only, D-007).
        NEXT_PUBLIC_MAP_TILE_URL: ${TRIMME_MAP_TILE_URL:-}
    image: trimme-web:dev
    environment:
      TRIMME_API_INTERNAL_URL: http://api:8080
      # Development-only preview routes (/[locale]/dev/*) used by the E2E smoke tests. Never enable in production.
      TRIMME_ENABLE_DEV_ROUTES: ${TRIMME_ENABLE_DEV_ROUTES:-true}
    ports:
      - "${TRIMME_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
